<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bencode.js 测试</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; }
    h1 { color: #333; }
    .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
    .test-section h3 { margin-top: 0; color: #555; }
    .result { background: #f5f5f5; padding: 10px; border-radius: 4px; margin: 10px 0; white-space: pre-wrap; word-break: break-all; }
    .success { color: green; }
    .error { color: red; }
    .debug { font-size: 12px; color: #666; background: #fff8e6; padding: 5px; margin: 5px 0; }
    button { padding: 8px 16px; margin: 5px 5px 5px 0; cursor: pointer; }
    input[type="file"] { margin: 10px 0; }
    #log { max-height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-top: 20px; font-family: monospace; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Bencode.js 解析器测试</h1>
  
  <div class="test-section">
    <h3>1. 基本功能测试</h3>
    <button onclick="runBasicTests()">运行基本测试</button>
    <div id="basic-results" class="result"></div>
  </div>
  
  <div class="test-section">
    <h3>2. 递归深度测试</h3>
    <button onclick="runDepthTest()">测试嵌套结构</button>
    <div id="depth-results" class="result"></div>
  </div>
  
  <div class="test-section">
    <h3>3. 边界情况测试</h3>
    <button onclick="runEdgeCaseTests()">运行边界测试</button>
    <div id="edge-results" class="result"></div>
  </div>
  
  <div class="test-section">
    <h3>4. 文件测试</h3>
    <input type="file" id="torrent-file" accept=".torrent">
    <button onclick="testFileLoad()">加载并解析</button>
    <div id="file-results" class="result"></div>
  </div>
  
  <div class="test-section">
    <h3>5. 调试日志</h3>
    <button onclick="clearLog()">清除日志</button>
    <div id="log"></div>
  </div>

  <script type="module">
    import { 
      decode, decodeString, decodeInt, decodeList, decodeDict,
      findInfoStart, findInfoEnd, findInfoHash, decodeTorrent 
    } from './src/bencode.js';
    
    // 暴露到全局作用域
    window.bencode = {
      decode, decodeString, decodeInt, decodeList, decodeDict,
      findInfoStart, findInfoEnd, findInfoHash, decodeTorrent
    };
    
    // 日志函数
    function log(msg, isDebug = false) {
      const logDiv = document.getElementById('log');
      const entry = document.createElement('div');
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      if (isDebug) entry.style.color = '#888';
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
    }
    window.log = log;
    
    // 显示结果
    function showResult(id, success, message) {
      const div = document.getElementById(id);
      div.innerHTML = `<span class="${success ? 'success' : 'error'}">${success ? '✓' : '✗'}</span> ${message}`;
    }
    window.showResult = showResult;
    
    // ============= 基本功能测试 =============
    window.runBasicTests = async function() {
      const results = document.getElementById('basic-results');
      const tests = [];
      
      // 测试 1: 解析整数
      log('测试 1: 解析整数 i123e');
      try {
        const enc = new TextEncoder().encode('i123e');
        const { result, pos } = decode(enc, 0);
        if (result === 123 && pos === 5) {
          tests.push('整数解析: 通过');
          log('  结果: ' + result + ', 位置: ' + pos);
        } else {
          tests.push('整数解析: 失败 - 结果=' + result + ', 期望=123');
          log('  失败: 结果=' + result + ', 位置=' + pos);
        }
      } catch (e) {
        tests.push('整数解析: 错误 - ' + e.message);
        log('  错误: ' + e.message);
      }
      
      // 测试 2: 解析负整数
      log('测试 2: 解析负整数 i-456e');
      try {
        const enc = new TextEncoder().encode('i-456e');
        const { result, pos } = decode(enc, 0);
        if (result === -456 && pos === 6) {
          tests.push('负整数解析: 通过');
          log('  结果: ' + result);
        } else {
          tests.push('负整数解析: 失败');
        }
      } catch (e) {
        tests.push('负整数解析: 错误 - ' + e.message);
      }
      
      // 测试 3: 解析字符串
      log('测试 3: 解析字符串 4:test');
      try {
        const enc = new TextEncoder().encode('4:test');
        const { result, pos } = decode(enc, 0);
        if (result === 'test' && pos === 6) {
          tests.push('字符串解析: 通过');
          log('  结果: ' + result);
        } else {
          tests.push('字符串解析: 失败 - 结果=' + result);
        }
      } catch (e) {
        tests.push('字符串解析: 错误 - ' + e.message);
      }
      
      // 测试 4: 解析列表
      log('测试 4: 解析列表 l4:abci123ee');
      try {
        const enc = new TextEncoder().encode('l4:abci123ee');
        const { result, pos } = decode(enc, 0);
        if (result[0] === 'abc' && result[1] === 123 && pos === 13) {
          tests.push('列表解析: 通过');
          log('  结果: ' + JSON.stringify(result));
        } else {
          tests.push('列表解析: 失败 - ' + JSON.stringify(result));
        }
      } catch (e) {
        tests.push('列表解析: 错误 - ' + e.message);
      }
      
      // 测试 5: 解析字典
      log('测试 5: 解析字典 d3:key5:valuee');
      try {
        const enc = new TextEncoder().encode('d3:key5:valuee');
        const { result, pos } = decode(enc, 0);
        if (result.key === 'value' && pos === 15) {
          tests.push('字典解析: 通过');
          log('  结果: ' + JSON.stringify(result));
        } else {
          tests.push('字典解析: 失败 - ' + JSON.stringify(result));
        }
      } catch (e) {
        tests.push('字典解析: 错误 - ' + e.message);
      }
      
      // 测试 6: 解析嵌套结构 (模拟 .torrent)
      log('测试 6: 解析嵌套结构');
      try {
        const torrentLike = 'd8:announce35:http://tracker.example.com/announce4:infod6:lengthi123456e4:name8:test.txtee';
        const enc = new TextEncoder().encode(torrentLike);
        const { result, pos } = decode(enc, 0);
        if (result.announce === 'http://tracker.example.com/announce' && 
            result.info && result.info.length === 123456) {
          tests.push('嵌套结构解析: 通过');
          log('  解析成功: announce=' + result.announce);
        } else {
          tests.push('嵌套结构解析: 失败');
          log('  结果: ' + JSON.stringify(result));
        }
      } catch (e) {
        tests.push('嵌套结构解析: 错误 - ' + e.message);
      }
      
      // 测试 7: 解析中文内容
      log('测试 7: 解析中文字符串');
      try {
        const chineseStr = '6:测试123';
        const enc = new TextEncoder().encode(chineseStr);
        const { result, pos } = decode(enc, 0);
        tests.push('中文解析: 通过 (结果: ' + result + ')');
        log('  结果: ' + result);
      } catch (e) {
        tests.push('中文解析: 错误 - ' + e.message);
      }
      
      results.innerHTML = tests.map(t => {
        if (t.includes('通过')) return '<div class="success">✓ ' + t + '</div>';
        if (t.includes('失败') || t.includes('错误')) return '<div class="error">✗ ' + t + '</div>';
        return t;
      }).join('');
    };
    
    // ============= 递归深度测试 =============
    window.runDepthTest = function() {
      const results = document.getElementById('depth-results');
      
      // 测试深度嵌套
      function createDeeplyNested(depth) {
        let s = 'l';
        for (let i = 0; i < depth; i++) {
          s += 'l';
        }
        s += 'e';
        for (let i = 0; i < depth; i++) {
          s += 'e';
        }
        return s;
      }
      
      const depths = [10, 50, 100, 500, 1000];
      const testResults = [];
      
      for (const depth of depths) {
        log('测试嵌套深度: ' + depth);
        try {
          const enc = new TextEncoder().encode(createDeeplyNested(depth));
          const start = performance.now();
          const { result, pos } = decode(enc, 0);
          const time = (performance.now() - start).toFixed(2);
          
          // 验证结果
          let expected = [];
          for (let i = 0; i < depth; i++) expected.push([]);
          const flat = JSON.stringify(result);
          const expFlat = JSON.stringify(expected);
          
          if (flat === expFlat) {
            testResults.push(`深度 ${depth}: ✓ 通过 (${time}ms)`);
            log(`  ✓ 通过 (${time}ms)`);
          } else {
            testResults.push(`深度 ${depth}: ✗ 结果不匹配`);
            log(`  ✗ 结果不匹配`);
          }
        } catch (e) {
          testResults.push(`深度 ${depth}: ✗ ${e.message}`);
          log(`  ✗ ${e.message}`);
        }
      }
      
      results.innerHTML = testResults.map(t => {
        if (t.includes('✓')) return '<div class="success">' + t + '</div>';
        return '<div class="error">' + t + '</div>';
      }).join('');
    };
    
    // ============= 边界情况测试 =============
    window.runEdgeCaseTests = function() {
      const results = document.getElementById('edge-results');
      const tests = [];
      
      // 测试空缓冲区
      log('测试: 空缓冲区');
      try {
        decode(new Uint8Array(0), 0);
        tests.push('空缓冲区: 失败 (应抛出错误)');
      } catch (e) {
        tests.push('空缓冲区: ✓ 正确抛出错误');
        log('  ✓ 正确抛出: ' + e.message);
      }
      
      // 测试无效格式
      log('测试: 无效格式 x');
      try {
        const enc = new TextEncoder().encode('x');
        decode(enc, 0);
        tests.push('无效格式: 失败 (应抛出错误)');
      } catch (e) {
        tests.push('无效格式: ✓ 正确抛出错误');
      }
      
      // 测试不完整的整数
      log('测试: 不完整的整数 i123');
      try {
        const enc = new TextEncoder().encode('i123');
        decode(enc, 0);
        tests.push('不完整整数: 失败 (应抛出错误)');
      } catch (e) {
        tests.push('不完整整数: ✓ 正确抛出错误');
      }
      
      // 测试不完整的字符串长度
      log('测试: 不完整的字符串长度 5:');
      try {
        const enc = new TextEncoder().encode('5:');
        decode(enc, 0);
        tests.push('不完整字符串长度: 失败 (应抛出错误)');
      } catch (e) {
        tests.push('不完整字符串长度: ✓ 正确抛出错误');
      }
      
      // 测试字符串长度超出实际内容
      log('测试: 字符串长度超出 10:short');
      try {
        const enc = new TextEncoder().encode('10:short');
        decode(enc, 0);
        tests.push('字符串长度超出: 失败 (应抛出错误)');
      } catch (e) {
        tests.push('字符串长度超出: ✓ 正确抛出错误');
      }
      
      // 测试 findInfoStart 和 findInfoEnd
      log('测试: findInfoStart/End 函数');
      try {
        const torrent = 'd8:announce35:http://tracker.example.com/announce4:infod6:lengthi123456e4:name8:test.txtee';
        const enc = new TextEncoder().encode(torrent);
        
        const infoStart = findInfoStart(enc);
        log('  infoStart: ' + infoStart);
        
        const infoEnd = findInfoEnd(enc, infoStart);
        log('  infoEnd: ' + infoEnd);
        
        if (infoStart !== null && infoEnd !== null) {
          const infoBytes = enc.slice(infoStart, infoEnd);
          log('  info 内容: ' + new TextDecoder().decode(infoBytes));
          
          // 验证 info 字典的完整性
          const infoDecoded = decode(enc, infoStart);
          log('  解析 info: ' + JSON.stringify(infoDecoded.result));
          
          if (infoDecoded.result.length === 123456 && infoDecoded.result.name === 'test.txt') {
            tests.push('findInfoStart/End: ✓ 通过');
          } else {
            tests.push('findInfoStart/End: ✗ info 内容不正确');
          }
        } else {
          tests.push('findInfoStart/End: ✗ 未找到 info 字段');
        }
      } catch (e) {
        tests.push('findInfoStart/End: ✗ ' + e.message);
        log('  错误: ' + e.message);
      }
      
      // 测试重复键
      log('测试: 重复键 d3:keystr1e3:keystr2ee');
      try {
        const enc = new TextEncoder().encode('d3:keystr1e3:keystr2ee');
        decode(enc, 0);
        tests.push('重复键: 失败 (应抛出错误)');
      } catch (e) {
        tests.push('重复键: ✓ 正确抛出错误');
      }
      
      results.innerHTML = tests.map(t => {
        if (t.includes('✓')) return '<div class="success">' + t + '</div>';
        return '<div class="error">' + t + '</div>';
      }).join('');
    };
    
    // ============= 文件测试 =============
    window.testFileLoad = function() {
      const fileInput = document.getElementById('torrent-file');
      const results = document.getElementById('file-results');
      
      if (!fileInput.files || !fileInput.files[0]) {
        results.innerHTML = '<span class="error">请选择一个 .torrent 文件</span>';
        return;
      }
      
      const file = fileInput.files[0];
      log('加载文件: ' + file.name + ' (' + file.size + ' bytes)');
      
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const buffer = e.target.result;
          log('文件读取成功，开始解析...');
          
          const start = performance.now();
          const { data, infoBytes, infoStart, infoEnd } = decodeTorrent(buffer);
          const time = (performance.now() - start).toFixed(2);
          
          log('解析完成: ' + time + 'ms');
          log('infoStart: ' + infoStart + ', infoEnd: ' + infoEnd);
          
          let html = '<div class="success">✓ 解析成功 (' + time + 'ms)</div>';
          html += '<div><strong>基本信息:</strong></div>';
          html += '<div class="debug">announce: ' + (data['announce'] || 'N/A') + '</div>';
          html += '<div class="debug">created by: ' + (data['creation date'] || 'N/A') + '</div>';
          if (data.info) {
            html += '<div class="debug">info.name: ' + (data.info.name || 'N/A') + '</div>';
            html += '<div class="debug">info.length: ' + (data.info.length || 'N/A') + '</div>';
            html += '<div class="debug">info.piece length: ' + (data.info['piece length'] || 'N/A') + '</div>';
          }
          if (infoBytes) {
            html += '<div class="debug">info hash 长度: ' + infoBytes.length + ' bytes</div>';
          }
          
          results.innerHTML = html;
        } catch (err) {
          log('解析错误: ' + err.message);
          results.innerHTML = '<div class="error">✗ 解析失败: ' + err.message + '</div>';
        }
      };
      
      reader.onerror = function() {
        log('文件读取错误');
        results.innerHTML = '<div class="error">✗ 文件读取失败</div>';
      };
      
      reader.readAsArrayBuffer(file);
    };
    
    // 清除日志
    window.clearLog = function() {
      document.getElementById('log').innerHTML = '';
    };
    
    // 页面加载完成
    log('测试页面已加载');
    log('bencode 模块已导入');
  </script>
</body>
</html>
